<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Cost & Profit Margin Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #666;
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 24px;
  }
  label {
    font-size: 13px;
    color: #555;
    display: block;
    margin-bottom: 4px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
  }
  input:focus {
    outline: none;
    border-color: #378ADD;
  }
  .error {
    color: #c0392b;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 28px;
  }
  .card {
    background: white;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
  }
  .card.highlight {
    background: #E6F1FB;
    border-color: #B5D4F4;
  }
  .card p.label {
    font-size: 11px;
    color: #666;
    margin: 0 0 6px;
  }
  .card p.value {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  .margin-row {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    padding: 0 4px;
    font-size: 14px;
  }
  .margin-row span:last-child {
    font-weight: 600;
  }
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>

<h1>Shipping cost & profit margin calculator</h1>
<p class="subtitle">See your real profit per sale after fees and shipping.</p>

<label for="cost">Product cost ($)</label>
<input type="number" id="cost" value="8" min="0" step="0.01">

<label for="price">Sale price ($)</label>
<input type="number" id="price" value="25" min="0" step="0.01">

<label for="shipping">Shipping cost you pay ($)</label>
<input type="number" id="shipping" value="4.50" min="0" step="0.01">

<label for="fee">Platform fee (%)</label>
<input type="number" id="fee" value="6.5" min="0" step="0.1">

<div class="error" id="err"></div>

<div class="results">
  <div class="card">
    <p class="label">Platform fee</p>
    <p class="value" id="out-fee">$0.00</p>
  </div>
  <div class="card">
    <p class="label">Total costs</p>
    <p class="value" id="out-costs">$0.00</p>
  </div>
  <div class="card highlight">
    <p class="label">Profit per sale</p>
    <p class="value" id="out-profit">$0.00</p>
  </div>
</div>

<div class="margin-row">
  <span>Margin</span>
  <span id="out-margin">0%</span>
</div>

<footer>Made with a free tool &mdash; build your own at anthropic.com/claude</footer>

<script>
function calc() {
  const cost = parseFloat(document.getElementById('cost').value);
  const price = parseFloat(document.getElementById('price').value);
  const shipping = parseFloat(document.getElementById('shipping').value);
  const feePct = parseFloat(document.getElementById('fee').value);
  const err = document.getElementById('err');

  if ([cost, price, shipping, feePct].some(v => isNaN(v) || v < 0)) {
    err.textContent = 'Enter valid non-negative numbers in every field.';
    err.style.display = 'block';
    return;
  }
  if (price === 0) {
    err.textContent = 'Sale price must be greater than 0.';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';

  const feeAmount = price * (feePct / 100);
  const totalCosts = cost + shipping + feeAmount;
  const profit = price - totalCosts;
  const margin = (profit / price) * 100;

  document.getElementById('out-fee').textContent = '$' + feeAmount.toFixed(2);
  document.getElementById('out-costs').textContent = '$' + totalCosts.toFixed(2);
  document.getElementById('out-profit').textContent = '$' + profit.toFixed(2);
  document.getElementById('out-margin').textContent = margin.toFixed(1) + '%';

  document.getElementById('out-profit').style.color = profit >= 0 ? '#185FA5' : '#c0392b';
}

['cost','price','shipping','fee'].forEach(id => {
  document.getElementById(id).addEventListener('input', calc);
});
calc();
</script>

</body>
</html>
